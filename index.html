<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>TKS Mapper — NICE Framework Alignment</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root{
  color-scheme: dark light;
  --bg:#0c0c0e;
  --panel:#151518;
  --panel-2:#1f1f23;
  --surface:#151518;
  --surface-2:#1f1f23;
  --line:rgba(239, 233, 222, 0.08);
  --line-strong:rgba(239, 233, 222, 0.16);
  --ink:#efe9de;
  --ink-mid:#aaa398;
  --ink-dim:#8a847a;
  --amber:#d4a853;
  --amber-hover:#e2bc6b;
  --amber-dim:rgba(212, 168, 83, 0.35);
  --teal:#4cc38a;
  --coral:#e5484d;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --sans:"Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f8f6f1;
    --panel:#fdfbf7;
    --panel-2:#f3efe6;
    --surface:#fdfbf7;
    --surface-2:#f3efe6;
    --line:rgba(31, 27, 22, 0.09);
    --line-strong:rgba(31, 27, 22, 0.18);
    --ink:#1f1b16;
    --ink-mid:#5e554a;
    --ink-dim:#7b7266;
    --amber:#8c6218;
    --amber-hover:#6e4c10;
    --amber-dim:rgba(140, 98, 24, 0.32);
    --teal:#16a34a;
    --coral:#dc2626;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
}
::selection{background:var(--amber-dim);color:var(--ink);}

.wrap{max-width:1400px;margin:0 auto;padding:28px 24px 60px;}

.masthead{
  display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;margin-bottom:22px;
  gap:20px;flex-wrap:wrap;
}
.brand-lockup{display:flex;align-items:center;gap:12px;}
.masthead h1{
  font-family:var(--display);font-size:24px;font-weight:500;letter-spacing:-0.025em;margin:0 0 4px;
}
.masthead .sub{
  font-family:var(--mono);font-size:12px;color:var(--ink-dim);letter-spacing:0.02em;
}
.doc-tag{
  font-family:var(--mono);font-size:11px;color:var(--amber);
  border:1px solid var(--amber-dim);border-radius:3px;padding:5px 10px;
  white-space:nowrap;
}

.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;}
@media (max-width:920px){.grid{grid-template-columns:1fr;}}

.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:20px;
}
.panel + .panel{margin-top:16px;}
.panel h2{
  font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--ink-dim);margin:0 0 14px;font-weight:600;
}

.dropzone{
  border:1.5px dashed var(--line);border-radius:6px;
  padding:28px 16px;text-align:center;cursor:pointer;
  transition:border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.drag{
  border-color:var(--amber-dim);background:rgba(217,164,65,0.05);
}
.dropzone .icon{font-size:22px;margin-bottom:8px;color:var(--ink-dim);}
.dropzone .lbl{font-size:13px;color:var(--ink);margin-bottom:4px;}
.dropzone .hint{font-size:11px;color:var(--ink-dim);font-family:var(--mono);}
input[type=file]{display:none;}

.filerow{
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--mono);font-size:12px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:5px;padding:9px 12px;margin-top:10px;
}
.filerow .x{cursor:pointer;color:var(--coral);}

.field{margin-top:16px;}
.field label{
  display:block;font-size:12px;color:var(--ink-dim);margin-bottom:8px;
}
.field .row{display:flex;align-items:center;gap:12px;}
input[type=range]{flex:1;accent-color:var(--amber);}
.field .val{
  font-family:var(--mono);font-size:13px;color:var(--amber);
  min-width:34px;text-align:right;
}

.btn{
  width:100%;padding:11px 14px;border-radius:6px;border:none;
  font-size:13px;font-weight:600;cursor:pointer;
  font-family:var(--sans);letter-spacing:0.01em;
  transition:filter .15s, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--amber);color:#1a1200;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{background:var(--line);color:var(--ink-dim);cursor:not-allowed;}
.btn-ghost{
  background:transparent;color:var(--ink-dim);border:1px solid var(--line);
  font-size:12px;padding:8px 12px;
}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-dim);}

.status{
  font-family:var(--mono);font-size:11.5px;margin-top:12px;
  padding:10px 12px;border-radius:5px;line-height:1.5;
}
.status.ok{background:rgba(79,157,146,0.1);color:var(--teal);border:1px solid rgba(79,157,146,0.3);}
.status.err{background:rgba(217,112,79,0.1);color:var(--coral);border:1px solid rgba(217,112,79,0.3);}
.status.info{background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line);}

.ledger-title{
  display:flex;justify-content:space-between;font-size:11px;
  color:var(--ink-dim);margin-bottom:10px;font-family:var(--mono);
}
.ledger-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;}
.ledger-row .cat{
  width:64px;font-family:var(--mono);color:var(--ink-dim);flex-shrink:0;
}
.ledger-bar{
  flex:1;height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;
  border:1px solid var(--line);
}
.ledger-bar > div{height:100%;background:var(--amber);}
.ledger-row .num{
  font-family:var(--mono);color:var(--ink);width:64px;text-align:right;
  font-size:11px;flex-shrink:0;
}

.stat-strip{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;margin-bottom:18px;
}
.stat{background:var(--panel);padding:16px 18px;}
.stat .n{font-family:var(--mono);font-size:22px;color:var(--amber);line-height:1;}
.stat .l{font-size:11px;color:var(--ink-dim);margin-top:6px;letter-spacing:0.02em;}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.toolbar .title{font-size:14px;font-weight:600;}
.toolbar .actions{display:flex;gap:8px;}

.qcard{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:18px 20px;margin-bottom:14px;
}
.qcard .qhead{display:flex;gap:12px;align-items:baseline;margin-bottom:12px;}
.qcard .qnum{
  font-family:var(--mono);color:var(--amber);font-size:12px;flex-shrink:0;
  border:1px solid var(--amber-dim);border-radius:3px;padding:2px 7px;
}
.qcard .qtext{font-size:14px;line-height:1.5;color:var(--ink);}
.qcard .warn{
  font-family:var(--mono);font-size:11px;color:var(--coral);margin-bottom:10px;
}

.tks-list{display:flex;flex-direction:column;gap:6px;}
.tks-item{
  display:grid;grid-template-columns:52px 56px 1fr 70px;gap:12px;align-items:center;
  background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
  padding:9px 12px;font-size:12.5px;
}
.tks-item .badge{
  font-family:var(--mono);font-size:10px;font-weight:700;text-align:center;
  border-radius:3px;padding:3px 0;letter-spacing:0.03em;
}
.badge.T{background:rgba(79,157,146,0.18);color:var(--teal);}
.badge.S{background:rgba(217,164,65,0.18);color:var(--amber);}
.badge.K{background:rgba(178,140,230,0.18);color:#b28ce6;}
.tks-item .id{font-family:var(--mono);color:var(--ink-dim);font-size:11px;}
.tks-item .txt{color:var(--ink);}
.tks-item .score{
  font-family:var(--mono);font-size:10.5px;text-align:right;
}
.score.strong{color:var(--teal);}
.score.moderate{color:var(--amber);}
.score.weak{color:var(--coral);}
.reused-flag{
  font-family:var(--mono);font-size:9px;color:var(--coral);
  border:1px solid var(--coral);border-radius:3px;padding:1px 4px;margin-left:6px;
}

.empty{
  text-align:center;padding:70px 20px;color:var(--ink-dim);
}
.empty .big{font-size:15px;color:var(--ink);margin-bottom:8px;}
.empty .small{font-size:12px;font-family:var(--mono);}

.loader{
  display:flex;align-items:center;gap:10px;font-family:var(--mono);
  font-size:12px;color:var(--ink-dim);padding:40px;justify-content:center;
}
.spin{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--amber);
  animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg);}}

a{color:var(--amber);}

.site-footer{
  margin-top:28px;
  padding:18px 24px 0;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  font-size:12px;
  color:var(--ink-dim);
}
.social-links{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
a.hig-capsule-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:44px;
  min-width:44px;
  padding:0 16px;
  border-radius:9999px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink-mid);
  font-size:12px;
  font-weight:600;
  text-decoration:none;
  transition:transform 120ms cubic-bezier(0.2, 0, 0, 1), background 150ms ease, color 150ms ease, border-color 150ms ease;
}
a.hig-capsule-link:hover{
  background:var(--surface-2);
  border-color:rgba(255,255,255,0.28);
  color:var(--ink);
}
a.hig-capsule-link:active{transform:scale(0.97);}
a.hig-capsule-link:focus-visible{
  border-color:var(--amber);
  box-shadow:0 0 0 1px var(--amber);
  outline:none;
}
a.hig-capsule-link svg{
  width:16px;
  height:16px;
  flex-shrink:0;
  color:var(--ink-dim);
}
#floating-tooltip{
  position:fixed;
  top:-9999px;
  left:-9999px;
  z-index:9999;
  max-width:280px;
  padding:8px 12px;
  border-radius:8px;
  background:var(--surface-2);
  border:1px solid var(--line-strong);
  color:var(--ink);
  font-size:12px;
  visibility:hidden;
  pointer-events:none;
  opacity:0;
  transition:opacity 120ms cubic-bezier(0.2, 0, 0, 1), visibility 120ms ease;
}
#floating-tooltip.visible{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.source-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}
a.source-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:44px;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink);
  font-size:12px;
  font-weight:500;
  text-decoration:none;
  transition:transform 120ms cubic-bezier(0.2, 0, 0, 1), border-color 150ms ease, color 150ms ease;
}
a.source-link:hover{
  border-color:var(--amber);
  color:var(--amber);
}
a.source-link:active{transform:scale(0.97);}
a.source-link:focus-visible{
  border-color:var(--amber);
  box-shadow:0 0 0 1px var(--amber);
  outline:none;
}
a.source-link .src-meta{
  display:block;
  font-family:var(--mono);
  font-size:10px;
  color:var(--ink-dim);
  margin-top:2px;
}
a.source-link svg{
  width:14px;
  height:14px;
  flex-shrink:0;
  color:var(--ink-dim);
}
.provenance-note{
  margin-top:10px;
  font-family:var(--mono);
  font-size:11px;
  line-height:1.45;
  color:var(--ink-dim);
}
@media (prefers-reduced-motion: reduce){
  a.hig-capsule-link, a.source-link, #floating-tooltip{transition:none;}
}
</style>

// ============================================================
// TKS Mapper — maps user-supplied questions to NICE Framework
// Task / Skill / Knowledge statements using TF-IDF similarity
// with a capacity-constrained greedy assignment.
// ============================================================

const TKS = JSON.parse(document.getElementById('tks-data').textContent); // [id, cat, text]
const CAT_NAME = {T:'Task', S:'Skill', K:'Knowledge'};

const STOPWORDS = new Set(("a an the of to in and or for with on at by from as is are be "+
  "this that these those it its into over under within across using use used able ability "+
  "will shall may can support supports supporting related organization organizational "+
  "appropriate applicable relevant various other such through").split(' '));

function tokenize(text){
  return (text.toLowerCase().match(/[a-z0-9]+/g) || [])
    .filter(w => w.length > 2 && !STOPWORDS.has(w))
    .map(stem);
}
// light stemmer: strips common suffixes so "encrypting/encryption/encrypt" overlap
function stem(w){
  if (w.length > 6 && w.endsWith('ing')) return w.slice(0,-3);
  if (w.length > 6 && w.endsWith('tion')) return w.slice(0,-4);
  if (w.length > 5 && w.endsWith('ies')) return w.slice(0,-3)+'y';
  if (w.length > 5 && w.endsWith('es')) return w.slice(0,-2);
  if (w.length > 4 && w.endsWith('ed')) return w.slice(0,-2);
  if (w.length > 4 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0,-1);
  return w;
}

// ---- Build corpus index once ----
let DF = new Map();        // term -> doc frequency (over TKS statements)
let IDF = new Map();
let TKS_VECS = [];         // sparse vectors [{term:weight}, norm]

function buildIndex(){
  const N = TKS.length;
  const tokLists = TKS.map(row => tokenize(row[2]));
  tokLists.forEach(toks => {
    const seen = new Set(toks);
    seen.forEach(t => DF.set(t, (DF.get(t)||0)+1));
  });
  DF.forEach((df,term) => IDF.set(term, Math.log((N+1)/(df+0.5))+1));

  TKS_VECS = tokLists.map(toks => {
    const tf = new Map();
    toks.forEach(t => tf.set(t, (tf.get(t)||0)+1));
    const vec = {};
    let norm = 0;
    tf.forEach((f,t) => {
      const w = (f) * (IDF.get(t)||0);
      vec[t] = w; norm += w*w;
    });
    return {vec, norm: Math.sqrt(norm)||1};
  });
}

function vectorize(text){
  const toks = tokenize(text);
  const tf = new Map();
  toks.forEach(t => tf.set(t, (tf.get(t)||0)+1));
  const vec = {}; let norm = 0;
  tf.forEach((f,t) => {
    const idf = IDF.get(t);
    if (!idf) return; // unseen term, ignore
    const w = f*idf;
    vec[t] = w; norm += w*w;
  });
  return {vec, norm: Math.sqrt(norm)||1};
}

function cosine(a, b){
  const [small,big] = Object.keys(a.vec).length < Object.keys(b.vec).length ? [a,b]:[b,a];
  let dot = 0;
  for (const t in small.vec){
    if (big.vec[t]) dot += small.vec[t]*big.vec[t];
  }
  return dot / (a.norm*b.norm);
}

function scoreLabel(s){
  if (s >= 0.22) return 'strong';
  if (s >= 0.10) return 'moderate';
  return 'weak';
}

// ---- Assignment ----
function assign(questions, perQuestion){
  const usage = new Array(TKS.length).fill(0);
  const results = questions.map((q, qi) => {
    const qvec = vectorize(q);
    const scored = TKS_VECS.map((tv,i) => ({i, s: cosine(qvec, tv)}))
      .sort((a,b) => b.s - a.s);
    const picks = [];
    for (const cand of scored){
      if (picks.length >= perQuestion) break;
      if (usage[cand.i] >= 2) continue;
      if (cand.s <= 0) continue;
      usage[cand.i]++;
      picks.push(cand);
    }
    // fallback: if fewer than 2 (only if pool exhausted / all zero-score), relax score>0 rule
    if (picks.length < 2){
      for (const cand of scored){
        if (picks.length >= perQuestion) break;
        if (usage[cand.i] >= 2) continue;
        if (picks.find(p=>p.i===cand.i)) continue;
        usage[cand.i]++;
        picks.push(cand);
      }
    }
    return {question: q, picks};
  });
  return {results, usage};
}

function wireEvents(){
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  dz.addEventListener('click', ()=> fi.click());
  dz.addEventListener('dragover', e=>{e.preventDefault(); dz.classList.add('drag');});
  dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
  dz.addEventListener('drop', e=>{
    e.preventDefault(); dz.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fi.addEventListener('change', e=>{
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  const slider = document.getElementById('perQSlider');
  slider.addEventListener('input', ()=>{
    document.getElementById('perQVal').textContent = slider.value;
  });

  document.getElementById('runBtn').addEventListener('click', runMapping);
  document.getElementById('templateBtn').addEventListener('click', downloadTemplate);
}

function clearEl(el){
  while (el.firstChild) el.removeChild(el.firstChild);
}

function makeEl(tag, className, text){
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function setStatusBox(id, message, cls, boldSuffix){
  const host = document.getElementById(id);
  clearEl(host);
  if (!message) return;
  const box = makeEl('div', `status ${cls}`, message);
  if (boldSuffix){
    box.appendChild(makeEl('strong', '', boldSuffix));
    box.appendChild(document.createTextNode('.'));
  }
  host.appendChild(box);
}

function setUploadStatus(message, cls, boldSuffix){
  setStatusBox('uploadStatus', message, cls, boldSuffix);
}
function setRunStatus(message, cls){
  setStatusBox('runStatus', message, cls);
}

function handleFile(file){
  uploadedFileName = file.name;
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      let rows;
      if (ext === 'csv'){
        const parsed = Papa.parse(e.target.result, {skipEmptyLines:true});
        rows = parsed.data;
      } else {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(sheet, {header:1, blankrows:false});
      }
      processRows(rows);
    } catch(err){
      setUploadStatus('Could not parse file: ' + err.message, 'err');
    }
  };
  if (ext === 'csv') reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

function processRows(rows){
  if (!rows || !rows.length){
    setUploadStatus('File appears empty.', 'err'); return;
  }
  // detect header: if first cell of first row looks like "question"/"questions", skip it
  let start = 0;
  const first = String(rows[0][0]||'').trim().toLowerCase();
  if (first === 'question' || first === 'questions' || first === 'text'){
    start = 1;
  }
  const questions = [];
  for (let i=start; i<rows.length; i++){
    const cell = rows[i] && rows[i][0];
    if (cell === undefined || cell === null) continue;
    const text = String(cell).trim();
    if (text) questions.push(text);
  }
  if (!questions.length){
    setUploadStatus('No question text found in the first column.', 'err');
    return;
  }
  if (questions.length > 45){
    setUploadStatus(`File has ${questions.length} questions — the limit is 45. Trim the list and re-upload.`, 'err');
    document.getElementById('runBtn').disabled = true;
    uploadedQuestions = null;
    renderFileRow();
    return;
  }
  uploadedQuestions = questions;
  setUploadStatus(`Loaded ${questions.length} question${questions.length===1?'':'s'} from `, 'ok', uploadedFileName);
  document.getElementById('runBtn').disabled = false;
  renderFileRow();
}

function renderFileRow(){
  const holder = document.getElementById('fileRowHolder');
  clearEl(holder);
  if (!uploadedFileName) return;
  const row = makeEl('div', 'filerow');
  row.appendChild(makeEl('span', '', uploadedFileName));
  const clearBtn = makeEl('span', 'x', '\u2715');
  clearBtn.id = 'clearFile';
  clearBtn.addEventListener('click', ()=>{
    uploadedQuestions = null; uploadedFileName='';
    document.getElementById('runBtn').disabled = true;
    setUploadStatus('', '');
    renderFileRow();
  });
  row.appendChild(clearBtn);
  holder.appendChild(row);
}

function downloadTemplate(){
  const csv = "question\nWhat steps would you take to identify the root cause of a network intrusion?\nHow would you assess the security posture of a newly acquired system?\n";
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tks_mapper_template.csv';
  a.click();
}

function makeLoader(text){
  const loader = makeEl('div', 'loader');
  loader.appendChild(makeEl('div', 'spin'));
  loader.appendChild(document.createTextNode(' ' + text));
  return loader;
}

function runMapping(){
  if (!uploadedQuestions) return;
  const perQ = parseInt(document.getElementById('perQSlider').value, 10);
  const resultsArea = document.getElementById('resultsArea');
  resultsArea.replaceChildren(makeLoader(`Scoring ${uploadedQuestions.length} question(s) against 2,211 TKS statements\u2026`));
  setRunStatus('', '');
  setTimeout(()=>{
    const {results, usage} = assign(uploadedQuestions, perQ);
    lastRun = {results, usage, perQ};
    renderResults(results, usage, perQ);
  }, 30);
}

function renderResults(results, usage, perQ){
  const total = results.reduce((s,r)=>s+r.picks.length,0);
  const uniqueUsed = usage.filter(u=>u>0).length;
  const atCap = usage.filter(u=>u>=2).length;
  const weakCount = results.reduce((s,r)=> s + r.picks.filter(p=>scoreLabel(p.s)==='weak').length, 0);

  const catCounts = {T:0,S:0,K:0};
  results.forEach(r=> r.picks.forEach(p=> catCounts[TKS[p.i][1]]++));

  const frag = document.createDocumentFragment();

  const statStrip = makeEl('div', 'stat-strip');
  [
    [results.length, 'questions mapped'],
    [total, 'total TKS assigned'],
    [uniqueUsed, 'unique statements used'],
    [weakCount, 'weak-match pairs (review)']
  ].forEach(([num, label]) => {
    const stat = makeEl('div', 'stat');
    stat.appendChild(makeEl('div', 'n', num));
    stat.appendChild(makeEl('div', 'l', label));
    statStrip.appendChild(stat);
  });
  frag.appendChild(statStrip);

  const toolbar = makeEl('div', 'toolbar');
  toolbar.appendChild(makeEl('div', 'title', 'Question \u2192 TKS alignment'));
  const actions = makeEl('div', 'actions');
  const exportCsvBtn = makeEl('button', 'btn btn-ghost', 'Export CSV');
  exportCsvBtn.id = 'exportCsv';
  exportCsvBtn.addEventListener('click', ()=>exportResults('csv'));
  const exportXlsxBtn = makeEl('button', 'btn btn-ghost', 'Export XLSX');
  exportXlsxBtn.id = 'exportXlsx';
  exportXlsxBtn.addEventListener('click', ()=>exportResults('xlsx'));
  actions.append(exportCsvBtn, exportXlsxBtn);
  toolbar.appendChild(actions);
  frag.appendChild(toolbar);

  results.forEach((r, qi) => {
    const qcard = makeEl('div', 'qcard');
    const qhead = makeEl('div', 'qhead');
    qhead.appendChild(makeEl('span', 'qnum', `Q${qi+1}`));
    qhead.appendChild(makeEl('span', 'qtext', r.question));
    qcard.appendChild(qhead);

    if (r.picks.length < 2){
      qcard.appendChild(makeEl('div', 'warn', `\u26A0 Only ${r.picks.length} statement(s) could be assigned \u2014 TKS pool may be near capacity.`));
    }

    const tksList = makeEl('div', 'tks-list');
    r.picks.forEach(p => {
      const row = TKS[p.i];
      const lbl = scoreLabel(p.s);
      const item = makeEl('div', 'tks-item');
      item.appendChild(makeEl('div', `badge ${row[1]}`, row[1]));
      item.appendChild(makeEl('div', 'id', row[0]));
      const txt = makeEl('div', 'txt', row[2]);
      if (usage[p.i] >= 2){
        txt.appendChild(makeEl('span', 'reused-flag', '2/2 USED'));
      }
      item.appendChild(txt);
      item.appendChild(makeEl('div', `score ${lbl}`, lbl));
      tksList.appendChild(item);
    });
    qcard.appendChild(tksList);
    frag.appendChild(qcard);
  });

  document.getElementById('resultsArea').replaceChildren(frag);

  // ledger
  const ledgerPanel = document.getElementById('ledgerPanel');
  ledgerPanel.style.display = 'block';
  const catTotals = {T:0,S:0,K:0};
  TKS.forEach(row => catTotals[row[1]]++);
  const catUsed = {T:0,S:0,K:0};
  usage.forEach((u,i)=>{ if(u>0) catUsed[TKS[i][1]]++; });
  const ledgerFrag = document.createDocumentFragment();
  ['T','S','K'].forEach(c => {
    const pct = Math.round(100*catUsed[c]/catTotals[c]);
    const lrow = makeEl('div', 'ledger-row');
    lrow.appendChild(makeEl('div', 'cat', CAT_NAME[c]));
    const bar = makeEl('div', 'ledger-bar');
    const fill = document.createElement('div');
    fill.style.width = `${pct}%`;
    bar.appendChild(fill);
    lrow.appendChild(bar);
    lrow.appendChild(makeEl('div', 'num', `${catUsed[c]} / ${catTotals[c]}`));
    ledgerFrag.appendChild(lrow);
  });
  const capNote = makeEl('div', '', `${atCap} statement(s) now at the 2-question cap.`);
  capNote.style.cssText = 'margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);';
  ledgerFrag.appendChild(capNote);
  document.getElementById('ledgerBody').replaceChildren(ledgerFrag);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function exportResults(kind){
  if (!lastRun) return;
  const rows = [['question_number','question_text','tks_id','tks_category','tks_text','match_strength']];
  lastRun.results.forEach((r, qi) => {
    r.picks.forEach(p => {
      const row = TKS[p.i];
      rows.push([qi+1, r.question, row[0], CAT_NAME[row[1]], row[2], scoreLabel(p.s)]);
    });
  });
  if (kind === 'csv'){
    const csv = rows.map(r => r.map(cell => {
      const s = String(cell);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tks_mapping_results.csv';
    a.click();
  } else {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'TKS Mapping');
    XLSX.writeFile(wb, 'tks_mapping_results.xlsx');
  }
}

// Position-Aware Auto-Hiding TooltipManager (WCAG 1.4.13 compliant)
class TooltipManager{
  constructor(autoHideMs = 4000){
    this.el = document.getElementById('floating-tooltip');
    this.autoHideMs = autoHideMs;
    this.activeTarget = null;
    this.hideTimer = null;
    this.autoHideTimer = null;

    document.addEventListener('mouseover', (e)=>{
      const target = e.target.closest('[data-tooltip]');
      if (target){
        this.cancelScheduledHide();
        this.show(target);
      }
    });
    document.addEventListener('mouseout', (e)=>{
      const target = e.target.closest('[data-tooltip]');
      if (target && !this.el.contains(e.relatedTarget)){
        this.scheduleHide(120);
      }
    });
    document.addEventListener('focusin', (e)=>{
      const target = e.target.closest('[data-tooltip]');
      if (target) this.show(target);
    });
    document.addEventListener('focusout', ()=>this.hide());
    this.el.addEventListener('mouseenter', ()=>{
      this.cancelScheduledHide();
      this.resetAutoHide();
    });
    this.el.addEventListener('mouseleave', ()=>this.scheduleHide(120));
    document.addEventListener('pointerdown', ()=>this.hide());
    document.addEventListener('scroll', ()=>this.hide(), true);
    window.addEventListener('blur', ()=>this.hide());
    document.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape') this.hide();
    });
  }
  cancelScheduledHide(){
    if (this.hideTimer){
      clearTimeout(this.hideTimer);
      this.hideTimer = null;
    }
  }
  scheduleHide(delayMs = 120){
    this.cancelScheduledHide();
    this.hideTimer = setTimeout(()=>this.hide(), delayMs);
  }
  resetAutoHide(){
    if (this.autoHideTimer) clearTimeout(this.autoHideTimer);
    this.autoHideTimer = setTimeout(()=>this.hide(), this.autoHideMs);
  }
  show(target){
    const text = target.getAttribute('data-tooltip') || '';
    if (!text) return;
    this.activeTarget = target;
    const shortcut = target.getAttribute('data-shortcut');
    this.el.textContent = shortcut ? `${text} (${shortcut})` : text;
    this.el.classList.add('visible');
    const rect = target.getBoundingClientRect();
    const tipRect = this.el.getBoundingClientRect();
    let top = rect.top - tipRect.height - 8;
    if (top < 8) top = rect.bottom + 8;
    const left = Math.max(8, Math.min(rect.left, window.innerWidth - tipRect.width - 8));
    this.el.style.top = top + 'px';
    this.el.style.left = left + 'px';
    this.resetAutoHide();
  }
  hide(){
    this.cancelScheduledHide();
    if (this.autoHideTimer){
      clearTimeout(this.autoHideTimer);
      this.autoHideTimer = null;
    }
    this.activeTarget = null;
    this.el.classList.remove('visible');
    this.el.style.top = '-9999px';
    this.el.style.left = '-9999px';
  }
}
